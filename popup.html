 <!DOCTYPE html>
 <html lang="en">
 <head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <style>
     body {
       font-family: 'Arial', sans-serif;
       margin: 0;
       padding: 0;
       background-color: #f0f0f0;
     }
 
     .container {
       width: 400px;
       height: 450px;
       margin: 20px auto;
       padding: 20px;
       background-color: #f0eaea;
       border-radius: 15px;
       box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
     }
 
     h1 {
       text-align: center;
       color: #333;
       font-size: 24px;
     }
 
     label {
       display: block;
       margin-bottom: 5px;
       color: #333;
     }
 
     input, textarea, select {
       width: 100%;
       padding: 8px;
       margin-bottom: 10px;
       box-sizing: border-box;
       border: 1px solid #ccc;
       border-radius: 4px;
       font-size: 14px;
     }
 
     select {
       background-color: #3498db;
       color: #fff;
     }
 
     .grid {
       display: grid;
       grid-template-columns: repeat(1, 1fr);
       gap: 20px;
     }
 
     .flex {
       display: flex;
       align-items: center;
     }
 
     .checkbox-label {
       margin-left: 5px;
       color: #333;
     }
 
     button {
       padding: 10px;
       color: #fff;
       border: none;
       cursor: pointer;
       border-radius: 4px;
       font-size: 16px;
     }
 
     #startButton {
       background-color: #2ecc71;
     }
 
     #stopButton {
       background-color: #e74c3c;
     }
   </style>
   <title>Farmingxyz Extension</title>
 </head>
 <body>
   <div class="container">
     <h1>Farmingxyz</h1>
 
     <div class="grid">
       <div>
         <label for="keywords" style="font-size: medium;">Keywords:</label>
         <input type="text" id="keywords" placeholder="Enter keywords">
 
         <label for="responses" style="font-size: medium;">Responses:</label>
         <textarea id="responses" placeholder="Enter responses"></textarea>
       </div>
 
       <div>
         <label for="replies" style="font-size: medium;">Replies per Session:</label>
         <input type="number" id="replies" min="1" value="0">
 
         <label for="speed" style="font-size: medium;">Bot Speed:</label>
         <select id="speed">
           <option value="slow">Slow</option>
           <option value="medium" selected>Medium</option>
           <option value="fast">Fast</option>
         </select>
       </div>
 
       <div>
         <div class="flex">
           <label for="follow" class="checkbox-label" style="font-size: medium;">Follow</label>
           <input type="checkbox" id="follow" >
           <label for="retweet" class="checkbox-label" style="font-size: medium;">Retweet</label>
           <input type="checkbox" id="retweet" >
           <label for="like" class="checkbox-label" style="font-size: medium;">Like</label>
           <input type="checkbox" id="like" >
          </div>
       </div>
     </div>
 
     <button id="startButton" style="margin-right: 30px;">Start</button>
     <button id="stopButton" style="font-size: medium;">Stop</button>
   </div>
   <script src="popup.js" defer></script>
 </body>
 </html>
